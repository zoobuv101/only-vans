name: Sync Instagram and publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "47 5 * * *"   # daily 05:47 UTC (06:47 BST / 05:47 GMT)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif

      # A failed sync (e.g. expired token) fails the run, and GitHub emails the repo owner.
      - name: Pull new Instagram posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/sync_instagram.py

      - name: Commit new posts and photos
        run: |
          git config user.name "instagram-sync-bot"
          git config user.email "actions@github.com"
          git add data/posts.json site/img/ig
          git commit -m "Sync Instagram posts $(date -u +%F)" && git push || echo "No new posts."

      - name: Build site
        run: python3 site/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deploy
        uses: actions/deploy-pages@v4
