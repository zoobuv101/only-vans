name: Sync Instagram and publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 3× daily so a late or dropped GitHub run only delays a new post by hours, not a day.
    # :47 avoids the top-of-hour rush. 05:47 / 11:47 / 17:47 UTC (06:47 / 12:47 / 18:47 BST).
    - cron: "47 5,11,17 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif google-auth requests

      # A failed sync (e.g. expired token) fails the run, and GitHub emails the repo owner.
      - name: Pull new Instagram posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/sync_instagram.py

      - name: Commit new posts and photos
        run: |
          git config user.name "instagram-sync-bot"
          git config user.email "actions@github.com"
          git add data/posts.json site/img/ig
          git commit -m "Sync Instagram posts $(date -u +%F)" && git push || echo "No new posts."

      - name: Build site
        run: python3 site/build.py

      - name: Find pages that changed (for search engines)
        continue-on-error: true
        run: python3 scripts/notify_search.py diff

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Tell search engines (IndexNow)
        continue-on-error: true
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
        run: python3 scripts/notify_search.py send
